<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#080706">
<link rel="apple-touch-icon" href="/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ledger">
<title>Sales Ledger</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080706;--cream:#f1e7d0;--gold:#c9a24a;--hi:#e8c56a;--dim:#a39673;--line:rgba(201,162,74,.38)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--dim);font:300 17px/1.6 Jost,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 28% 70% at 94% 80%,rgba(140,112,52,.5),transparent 70%),linear-gradient(100deg,transparent 78%,rgba(201,162,74,.09) 88%,transparent 97%),radial-gradient(ellipse 50% 40% at 10% 0%,rgba(201,162,74,.08),transparent 70%)}
.dust{position:fixed;inset:0;pointer-events:none}
.dust i{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--hi);box-shadow:0 0 6px var(--hi);opacity:.1;animation:tw 5s infinite}
@keyframes tw{50%{opacity:.8}}
nav.top{position:relative;display:flex;justify-content:space-between;align-items:center;padding:max(16px,env(safe-area-inset-top)) max(24px,6vw) 16px;border-bottom:1px solid var(--line)}
.logo{font:500 26px Cormorant Garamond,Georgia,serif;color:var(--cream)}.logo b{color:var(--hi);font-size:14px;margin-right:10px;text-shadow:0 0 12px var(--hi)}
.tr{display:flex;align-items:center;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--cream)}
.eye{display:grid;place-items:center;width:40px;height:40px;margin-right:20px;background:transparent;border:1px solid var(--line);color:var(--cream);cursor:pointer;transition:.25s}
.eye:hover,.eye[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 16px rgba(201,162,74,.45)}
.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
body.private .cmp,body.private #gtxt,body.private .gsub,body.private .bar,body.private .rec b,body.private .rec small,body.private #hero,body.private #today,body.private .stats b,body.private #svg{filter:blur(16px);user-select:none;pointer-events:none}
.cmp{font-size:16px;color:var(--hi);min-height:26px}.cmp.down{color:#d39a76}
.goal{margin-top:52px}.gtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
#gtxt{font:400 28px Cormorant Garamond,Georgia,serif;color:var(--cream)}
.bar{height:10px;border:1px solid var(--line);position:relative;margin-top:12px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#8f6d24,#f6dc8f);box-shadow:0 0 16px rgba(232,197,106,.7);transition:width 1.2s}
.gsub{margin-top:10px;font-size:15px}
.rec{margin-top:36px}.stats small{display:block;font-size:14px}
#hero,#today,.stats b,#svg{transition:filter .3s}
#dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--hi);box-shadow:0 0 10px var(--hi);margin-right:10px;animation:tw 2s infinite}
#dot.err{background:#c0583a;box-shadow:0 0 10px #c0583a}
main{position:relative;max-width:1240px;margin:0 auto;padding:56px max(24px,6vw) 64px}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.eyebrow{display:flex;align-items:center;gap:16px;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--hi)}
.eyebrow::before{content:"";width:52px;height:1px;background:var(--hi)}
#hero{font:400 clamp(64px,11vw,156px)/1.05 Cormorant Garamond,Georgia,serif;color:var(--cream);text-shadow:0 0 36px rgba(232,197,106,.38),0 0 90px rgba(232,197,106,.18);margin:18px 0 8px;overflow-wrap:anywhere}
.sub{max-width:34ch}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.btns button{font:500 13px Jost,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--cream);background:transparent;border:1px solid var(--gold);padding:16px 26px;cursor:pointer;transition:.25s}
.btns button:hover{box-shadow:0 0 18px rgba(201,162,74,.45)}
.btns button[aria-pressed=true]{background:rgba(201,162,74,.16);box-shadow:0 0 26px rgba(232,197,106,.45),inset 0 0 14px rgba(232,197,106,.2);color:#fff6dc}
button:focus-visible,input:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
.arch{position:relative;width:min(420px,100%);aspect-ratio:1;margin:0 auto}
.arch svg.ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.door{position:absolute;left:25%;right:25%;top:21%;bottom:20%;border:1px solid var(--gold);border-bottom:0;border-radius:999px 999px 0 0;background:linear-gradient(to top,rgba(201,162,74,.3) var(--fill,0%),transparent var(--fill,0%)),linear-gradient(#120e08,#0b0906);box-shadow:0 0 34px rgba(201,162,74,.28),inset 0 0 40px rgba(201,162,74,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#today{font:500 clamp(32px,5vw,50px)/1 Cormorant Garamond,Georgia,serif;color:var(--hi);text-shadow:0 0 22px rgba(232,197,106,.6)}
.door small{font-size:11px;letter-spacing:.24em;text-transform:uppercase;margin-top:8px}
.badge{position:absolute;left:8%;bottom:19%;display:flex;align-items:center;background:#0a0806;border:1px solid var(--line);padding:9px 14px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cream)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);margin-top:56px}
.stats div{padding:22px 20px 6px 0}.stats div+div{padding-left:22px;border-left:1px solid var(--line)}
.lbl{font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.stats b{display:block;font:400 36px Cormorant Garamond,Georgia,serif;color:var(--cream);text-shadow:0 0 18px rgba(232,197,106,.3)}
.chart{margin-top:36px}
svg#svg{width:100%;height:170px;display:block;filter:drop-shadow(0 0 8px rgba(232,197,106,.35));margin-top:10px}
.axis{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}
#keybox{display:none;margin-top:48px;gap:10px;flex-wrap:wrap}
#keybox input{flex:1;min-width:200px;background:#100d08;border:1px solid var(--line);color:var(--cream);padding:14px;font:inherit}
#keybox button{font:500 13px Jost;letter-spacing:.22em;text-transform:uppercase;background:transparent;color:var(--cream);border:1px solid var(--gold);padding:14px 26px;cursor:pointer}
@media (max-width:860px){.hero{grid-template-columns:1fr}.arch{width:min(340px,100%)}}
@media (prefers-reduced-motion:reduce){.arch svg.ring,.dust i,#dot{animation:none}}
</style>
</head>
<body>
<div class="dust" id="dust" aria-hidden="true"></div>
<nav class="top"><span class="logo"><b>◆</b>Sales Ledger</span><span class="tr"><button class="eye" id="eye" type="button" aria-pressed="false" aria-label="Hide amounts"></button><span id="dot"></span><span id="stxt">Loading…</span></span></nav>
<main>
<form id="keybox"><input id="keyin" type="password" placeholder="Enter your dashboard key" autocomplete="current-password"><button>Unlock</button></form>
<div id="app">
<section class="hero">
<div>
<div class="eyebrow" id="cap">Commission earned</div>
<div id="hero">$0.00</div>
<div class="cmp" id="cmp"></div>
<p class="sub">Your affiliate commission, tracked live from every referred sale.</p>
<div class="btns" id="tabs" role="group" aria-label="Time period"></div>
</div>
<div class="arch">
<svg class="ring" viewBox="0 0 400 400" aria-hidden="true"><defs><path id="c" d="M200,200 m-172,0 a172,172 0 1,1 344,0 a172,172 0 1,1 -344,0"/></defs><text fill="#c9a24a" font-family="Jost,sans-serif" font-size="14" font-weight="500" letter-spacing="7"><textPath href="#c">COMMISSION · LIVE SALES · AFFILIATE EARNINGS · EVERY ORDER COUNTS · </textPath></text></svg>
<div class="door"><div id="today">$0.00</div><small>Earned today</small></div>
<div class="badge"><span id="dot2" style="width:8px;height:8px;border-radius:50%;background:var(--hi);box-shadow:0 0 10px var(--hi);margin-right:10px"></span>Tracking live</div>
</div>
</section>
<section class="goal"><div class="gtop"><span class="lbl">Monthly goal</span><span id="gtxt"></span></div><div class="bar"><i id="gbar"></i></div><div class="gsub" id="gsub"></div></section>
<section class="stats">
<div><span class="lbl">Sales volume</span><b id="s-sales">–</b></div>
<div><span class="lbl">Orders</span><b id="s-orders">–</b></div>
<div><span class="lbl">Visits</span><b id="s-visits">–</b></div>
<div><span class="lbl">Conversion</span><b id="s-conv">–</b></div>
</section>
<section class="stats rec">
<div><span class="lbl">Top month</span><b id="r-month">–</b><small id="r-month2"></small></div>
<div><span class="lbl">Best day</span><b id="r-day">–</b><small id="r-day2"></small></div>
</section>
<section class="chart"><span class="lbl" id="ccap">Commission per day</span><svg id="svg" viewBox="0 0 1000 170" preserveAspectRatio="none" role="img" aria-label="Commission per day"></svg><div class="axis"><span id="a1"></span><span id="a2"></span></div></section>
</div>
</main>
<script>
const $=s=>document.querySelector(s),P=[1,7,30,'M',90,365],GOAL=1000;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const EYE='<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',EYEOFF=EYE.replace('</svg>','<path d="M3 3l18 18"/></svg>');
function setPriv(p){document.body.classList.toggle('private',p);const e=$('#eye');e.innerHTML=p?EYEOFF:EYE;e.setAttribute('aria-pressed',p);e.setAttribute('aria-label',p?'Show amounts':'Hide amounts');store.set('priv',p?'1':'0')}
$('#eye').onclick=()=>setPriv(!document.body.classList.contains('private'));
setPriv(store.get('priv')==='1');
let days=[],sp=store.get('period'),period=sp==='M'?'M':(P.includes(+sp)?+sp:7),shown=0,first=true;
const usd=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const setStatus=(t,e)=>{$('#stxt').textContent=t;$('#dot').className=e?'err':''};
$('#dust').innerHTML=Array.from({length:26},()=>`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*5}s;animation-duration:${4+Math.random()*5}s"></i>`).join('');
$('#tabs').innerHTML=P.map(p=>`<button data-p="${p}" aria-pressed="${p===period}">${p==='M'?'This month':p+' day'+(p>1?'s':'')}</button>`).join('');
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;period=b.dataset.p==='M'?'M':+b.dataset.p;store.set('period',period);document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
function count(to){const from=shown,t0=performance.now(),d=first?1400:700;first=false;
 (function f(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);shown=from+(to-from)*e;$('#hero').textContent=usd(shown);if(k<1)requestAnimationFrame(f);else shown=to})(t0)}
function render(){
 if(!days.length)return;
 const N=period==='M'?days.filter(d=>d.t.startsWith(days[0].t.slice(0,7))).length:period,s=days.slice(0,N),sum=k=>s.reduce((a,d)=>a+d[k],0),earn=sum('earn'),orders=sum('orders'),visits=sum('visits');
 $('#cap').textContent=period===1?'Commission earned today':period==='M'?'Commission this month':`Commission, last ${period} days`;
 count(earn);$('#today').textContent=usd(days[0].earn);
 $('#s-sales').textContent=usd(sum('sales'));$('#s-orders').textContent=orders.toLocaleString('en-US');
 $('#s-visits').textContent=visits.toLocaleString('en-US');$('#s-conv').textContent=visits?(orders/visits*100).toFixed(1)+'%':'–';

 const sm=a=>a.reduce((x,d)=>x+d.earn,0),m0=days[0].t.slice(0,7),mtd=sm(days.filter(d=>d.t.startsWith(m0))),dom=+days[0].t.slice(8),dim=new Date(+m0.slice(0,4),+m0.slice(5),0).getDate(),pct=Math.min(100,mtd/GOAL*100),pace=mtd/dom*dim;
 $('#gtxt').textContent=`${usd(mtd)} of ${usd(GOAL)}`;$('#gbar').style.width=pct+'%';$('.door').style.setProperty('--fill',pct+'%');
 $('#gsub').textContent=(mtd>=GOAL?'Goal reached! ':`${pct.toFixed(0)}% done. `)+`On pace for ${usd(pace)} this month.`;
 let prev=null,lab='';
 if(period==='M'){const d=new Date(+m0.slice(0,4),+m0.slice(5)-2,1),pm=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');prev=sm(days.filter(x=>x.t.startsWith(pm)&&+x.t.slice(8)<=N));lab='the same days last month'}
 else if(days.length>=2*period){prev=sm(days.slice(period,2*period));lab=period===1?'yesterday':`the previous ${period} days`}
 const cm=$('#cmp');
 if(prev===null||(prev===0&&earn===0)){cm.textContent=''}
 else if(prev===0){cm.className='cmp';cm.textContent=`▲ Up from $0.00 in ${lab}`}
 else{const ch=(earn-prev)/prev*100;cm.className='cmp'+(ch<0?' down':'');cm.textContent=`${ch>=0?'▲':'▼'} ${Math.abs(ch).toFixed(0)}% vs ${lab} (${usd(prev)})`}
 const mon={};days.forEach(d=>{const m=d.t.slice(0,7);mon[m]=(mon[m]||0)+d.earn});
 const [bm,be]=Object.entries(mon).sort((a,b)=>b[1]-a[1])[0],bd=days.reduce((a,d)=>d.earn>a.earn?d:a,days[0]);
 $('#r-month').textContent=be>0?usd(be):'–';$('#r-month2').textContent=be>0?new Date(+bm.slice(0,4),+bm.slice(5)-1,1).toLocaleString('en-US',{month:'long',year:'numeric'})+(bm===m0?', this month':''):'';
 $('#r-day').textContent=bd.earn>0?usd(bd.earn):'–';$('#r-day2').textContent=bd.earn>0?new Date(bd.t+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
 const n=Math.max(N,7),c=days.slice(0,n).reverse(),max=Math.max(...c.map(d=>d.earn),1),w=1000/n;
 $('#svg').innerHTML='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dc8f"/><stop offset="1" stop-color="#8f6d24"/></linearGradient></defs>'+
  c.map((d,i)=>{const h=Math.max(d.earn/max*156,d.earn>0?3:1.5);return `<rect x="${i*w+w*.15}" y="${170-h}" width="${w*.7}" height="${h}" fill="url(#g)" opacity="${d.earn>0?1:.3}"><title>${d.t}: ${usd(d.earn)}</title></rect>`}).join('');
 $('#ccap').textContent=period==='M'&&N>=7?'Commission per day, this month':`Commission per day, last ${n} days`;$('#a1').textContent=c[0].t;$('#a2').textContent=c[c.length-1].t;
}
async function load(){
 try{
  const r=await fetch('/api/stats',{headers:{'x-key':store.get('key')||''},cache:'no-store'});
  if(r.status===401){$('#keybox').style.display='flex';$('#app').style.display='none';setStatus('Locked',true);return}
  if(!r.ok){let m='Error '+r.status;try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}
  const j=await r.json();
  days=Object.values(j).map(d=>{const [dd,mm,yy]=d.date.split('.');return{t:`${yy}-${mm}-${dd}`,orders:+d.orders,visits:+d.visits,sales:+d.sum_price_clean,earn:+d.sum_earnings_clean}}).sort((a,b)=>a.t<b.t?1:-1);
  $('#keybox').style.display='none';$('#app').style.display='';render();
  setStatus('Live, updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
 }catch(e){setStatus('Could not load stats: '+e.message,true)}
}
$('#keybox').onsubmit=e=>{e.preventDefault();store.set('key',$('#keyin').value);load()};
load();setInterval(load,30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
