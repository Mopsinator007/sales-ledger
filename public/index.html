<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0c0c0e">
<link rel="apple-touch-icon" href="/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="color-scheme" content="dark">
<title>Sales Ledger</title>
<link rel="icon" type="image/x-icon" href="/public/favicon.ico">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0c0c0e;--panel:#121215;--ink:#eeece9;--muted:#95929a;--red:#ff3d3d;--fill:#e5242a;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.22);--glow:rgba(255,61,61,.17);--nav:rgba(12,12,14,.8);--grid:rgba(255,255,255,.075);--lit:rgba(115,14,26,.9);--hglow:rgba(90,10,22,.24);--disp:"Archivo","Helvetica Neue",Arial,sans-serif;--mono:var(--disp);--cell:16px}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{color:var(--ink);font:400 17px/1.6 var(--disp);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{width:min(1200px,100% - clamp(40px,8vw,128px));margin:0 auto}

.bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
.bg-grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:var(--cell) var(--cell);background-position:-1px -1px}
.bg-lit,.bg-glow{opacity:var(--on,0);transition:opacity .35s}
.bg-lit{z-index:30;background-image:linear-gradient(var(--lit) 1px,transparent 1px),linear-gradient(90deg,var(--lit) 1px,transparent 1px);background-size:var(--cell) var(--cell);background-position:-1px -1px;-webkit-mask-image:radial-gradient(circle 110px at var(--mx,50%) var(--my,50%),#000,rgba(0,0,0,.4) 50%,transparent);mask-image:radial-gradient(circle 110px at var(--mx,50%) var(--my,50%),#000,rgba(0,0,0,.4) 50%,transparent)}
.bg-glow{background:radial-gradient(circle 160px at var(--mx,50%) var(--my,50%),var(--hglow),transparent 70%)}
.bg-cell{position:fixed;left:0;top:0;z-index:31;pointer-events:none;width:calc(var(--cell) + 1px);height:calc(var(--cell) + 1px);background:rgba(100,14,26,.24);box-shadow:inset 0 0 0 1px rgba(140,24,40,.6);transform:translate(var(--cx,0px),var(--cy,0px));opacity:var(--on,0);transition:opacity .35s,transform .12s ease-out}
@media(hover:none){.bg-lit,.bg-glow,.bg-cell{display:none}}

.lbl{font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--muted);font-size:15px;font-weight:500}
.eyebrow::before{content:"";width:9px;height:9px;background:var(--red);flex:none}
section{position:relative;border-top:1px solid var(--line2);padding:clamp(40px,6vw,72px) 0}
section::before,section::after{content:"";position:absolute;top:-6px;width:11px;height:11px;background:linear-gradient(var(--red),var(--red)) 50% 0/1px 100% no-repeat,linear-gradient(var(--red),var(--red)) 0 50%/100% 1px no-repeat}
section::before{left:calc((100% - min(1200px,100% - clamp(40px,8vw,128px)))/2 - 5px)}
section::after{right:calc((100% - min(1200px,100% - clamp(40px,8vw,128px)))/2 - 5px)}

nav{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-stretch:112%;font-size:22px;letter-spacing:-.03em}
.dm,#dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:ping 2s infinite;flex:none}
#dot{margin-right:10px;width:8px;height:8px}#dot.err{background:#777;animation:none}
.tr{display:flex;align-items:center;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.eye{display:grid;place-items:center;width:40px;height:40px;margin-right:18px;background:transparent;border:1px solid var(--line2);color:var(--ink);cursor:pointer;transition:.25s}
.eye:hover,.eye[aria-pressed=true]{border-color:var(--red);color:var(--red)}
.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
body.private .cmp,body.private #gtxt,body.private .gsub,body.private .bar,body.private .rec b,body.private .rec small,body.private #hero,body.private #today,body.private .stats b,body.private #svg{filter:blur(16px);user-select:none;pointer-events:none}
#hero,#today,.stats b,#svg{transition:filter .3s}

.hero{padding:clamp(40px,6vw,80px) 0 clamp(48px,7vw,90px);border-top:0;position:relative}
.hero .wrap{display:grid;grid-template-columns:1.12fr .88fr;gap:clamp(28px,5vw,80px);align-items:center}
.spot{position:absolute;z-index:-1;left:40%;right:-10%;top:-30%;bottom:0;pointer-events:none;filter:blur(30px);background:conic-gradient(from 172deg at 62% 0%,transparent 0deg,var(--glow) 12deg,transparent 26deg)}
#hero{font:800 clamp(52px,9.5vw,132px)/.96 var(--disp);font-stretch:112%;letter-spacing:-.04em;margin:6px 0 10px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.cmp{font:500 16px var(--mono);color:var(--red);min-height:24px;letter-spacing:.04em}.cmp.down{color:var(--muted)}
.sub{max-width:36ch;color:var(--muted);margin-top:8px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.btns button{font:600 15px var(--disp);color:var(--ink);background:transparent;border:0;box-shadow:inset 0 0 0 1px var(--line2);padding:13px 22px;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.btns button:hover{box-shadow:inset 0 0 0 1px var(--red)}
.btns button[aria-pressed=true]{background:var(--fill);color:#fff;box-shadow:none;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}

.vf{position:relative;width:min(100%,420px);margin:0 0 0 auto}
.vf-frame{position:relative;aspect-ratio:4/5;overflow:hidden;background:#09090a;border:1px solid var(--line2);box-shadow:0 40px 90px -30px rgba(0,0,0,.55),0 0 80px -20px var(--glow)}
.fillbg{position:absolute;inset:0;background:linear-gradient(to top,rgba(229,36,42,.38) var(--fill,0%),transparent var(--fill,0%)),radial-gradient(70% 50% at 50% 32%,rgba(255,61,61,.18),transparent 70%);transition:background .6s}
.fillbg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 52%,rgba(0,0,0,.6))}
.vf-frame::after{content:"";position:absolute;inset:14px;pointer-events:none;z-index:4;--c:rgba(255,255,255,.75);background:linear-gradient(var(--c),var(--c)) 0 0/16px 1px no-repeat,linear-gradient(var(--c),var(--c)) 0 0/1px 16px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/16px 1px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/1px 16px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/16px 1px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/1px 16px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/16px 1px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/1px 16px no-repeat}
.read{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#today{font:800 clamp(40px,6vw,64px)/1 var(--disp);font-stretch:112%;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.read small{margin-top:12px;font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--red)}

.gtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
#gtxt{font:800 clamp(26px,3.6vw,40px)/1 var(--disp);font-stretch:110%;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{height:14px;border:1px solid var(--line2);position:relative;margin-top:16px;background:repeating-linear-gradient(90deg,transparent 0 9.9%,var(--line) 9.9% 10%)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(135deg,var(--fill) 0 8px,#b01a20 8px 16px);box-shadow:0 0 16px rgba(255,61,61,.45);transition:width 1.2s}
.gsub{margin-top:12px;font:400 16px var(--mono);color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stats div{padding:6px 20px 6px 0}.stats div+div{padding-left:22px;border-left:1px solid var(--line)}
.stats b{display:block;font:800 clamp(28px,3.4vw,42px)/1.15 var(--disp);font-stretch:110%;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}
.stats small{display:block;font:400 15px var(--mono);color:var(--muted)}
svg#svg{width:100%;height:170px;display:block;margin-top:14px}
.axis{display:flex;justify-content:space-between;font:400 12px var(--mono);color:var(--muted);margin-top:8px}

#keybox{display:none;margin:48px 0;gap:10px;flex-wrap:wrap}
#keybox input{flex:1;min-width:200px;background:transparent;border:1px solid var(--line2);color:var(--ink);padding:14px;font:400 17px var(--disp);border-radius:0}
#keybox input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--glow)}
#keybox button{font:600 15px var(--disp);background:var(--fill);color:#fff;border:0;padding:14px 28px;cursor:pointer;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
#keybox button:hover{background:var(--ink);color:var(--bg)}

@keyframes ping{70%{box-shadow:0 0 0 9px rgba(255,61,61,0)}0%{box-shadow:0 0 0 0 rgba(255,61,61,.6)}}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}.vf{margin:0 auto;width:min(88%,380px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg bg-grid" aria-hidden="true"></div>
<div class="bg bg-lit" aria-hidden="true"></div>
<div class="bg bg-glow" aria-hidden="true"></div>
<div class="bg-cell" aria-hidden="true"></div>
<nav><div class="wrap"><span class="logo"><i class="dm"></i>Sales Ledger</span><span class="tr"><button class="eye" id="eye" type="button" aria-pressed="false" aria-label="Hide amounts"></button><span id="dot"></span><span id="stxt">Loading…</span></span></div></nav>
<main>
<div class="wrap"><form id="keybox"><input id="keyin" type="password" placeholder="Enter your dashboard key" autocomplete="current-password"><button>Unlock</button></form></div>
<div id="app">
<header class="hero">
<div class="spot"></div>
<div class="wrap">
<div>
<p class="eyebrow" id="cap">Commission earned</p>
<div id="hero">$0.00</div>
<div class="cmp" id="cmp"></div>
<p class="sub">Your affiliate commission, tracked live from every referred sale.</p>
<div class="btns" id="tabs" role="group" aria-label="Time period"></div>
</div>
<div class="vf"><div class="vf-frame">
<div class="fillbg" id="fillbg"></div>
<div class="read"><div id="today">$0.00</div><small>Earned today</small></div>
</div></div>
</div>
</header>
<section class="goal"><div class="wrap"><div class="gtop"><span class="lbl">Monthly goal</span><span id="gtxt"></span></div><div class="bar"><i id="gbar"></i></div><div class="gsub" id="gsub"></div></div></section>
<section><div class="wrap stats">
<div><span class="lbl">Sales volume</span><b id="s-sales">–</b></div>
<div><span class="lbl">Orders</span><b id="s-orders">–</b></div>
<div><span class="lbl">Visits</span><b id="s-visits">–</b></div>
<div><span class="lbl">Conversion</span><b id="s-conv">–</b></div>
</div></section>
<section><div class="wrap stats rec">
<div><span class="lbl">Top month</span><b id="r-month">–</b><small id="r-month2"></small></div>
<div><span class="lbl">Best day</span><b id="r-day">–</b><small id="r-day2"></small></div>
</div></section>
<section class="chart"><div class="wrap"><span class="lbl" id="ccap">Commission per day</span><svg id="svg" viewBox="0 0 1000 170" preserveAspectRatio="none" role="img" aria-label="Commission per day"></svg><div class="axis"><span id="a1"></span><span id="a2"></span></div></div></section>
</div>
</main>
<script>
const $=s=>document.querySelector(s),P=[1,7,30,'M',90,365],GOAL=1000;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const EYE='<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',EYEOFF=EYE.replace('</svg>','<path d="M3 3l18 18"/></svg>');
function setPriv(p){document.body.classList.toggle('private',p);const e=$('#eye');e.innerHTML=p?EYEOFF:EYE;e.setAttribute('aria-pressed',p);e.setAttribute('aria-label',p?'Show amounts':'Hide amounts');store.set('priv',p?'1':'0')}
$('#eye').onclick=()=>setPriv(!document.body.classList.contains('private'));
setPriv(store.get('priv')==='1');
let days=[],sp=store.get('period'),period=sp==='M'?'M':(P.includes(+sp)?+sp:7),shown=0,first=true;
const usd=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const setStatus=(t,e)=>{$('#stxt').textContent=t;$('#dot').className=e?'err':''};
$('#tabs').innerHTML=P.map(p=>`<button data-p="${p}" aria-pressed="${p===period}">${p==='M'?'This month':p+' day'+(p>1?'s':'')}</button>`).join('');
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;period=b.dataset.p==='M'?'M':+b.dataset.p;store.set('period',period);document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
function count(to){const from=shown,t0=performance.now(),d=first?1400:700;first=false;
 (function f(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);shown=from+(to-from)*e;$('#hero').textContent=usd(shown);if(k<1)requestAnimationFrame(f);else shown=to})(t0)}
function render(){
 if(!days.length)return;
 const N=period==='M'?days.filter(d=>d.t.startsWith(days[0].t.slice(0,7))).length:period,s=days.slice(0,N),sum=k=>s.reduce((a,d)=>a+d[k],0),earn=sum('earn'),orders=sum('orders'),visits=sum('visits');
 $('#cap').textContent=period===1?'Commission earned today':period==='M'?'Commission this month':`Commission, last ${period} days`;
 count(earn);$('#today').textContent=usd(days[0].earn);
 $('#s-sales').textContent=usd(sum('sales'));$('#s-orders').textContent=orders.toLocaleString('en-US');
 $('#s-visits').textContent=visits.toLocaleString('en-US');$('#s-conv').textContent=visits?(orders/visits*100).toFixed(1)+'%':'–';

 const sm=a=>a.reduce((x,d)=>x+d.earn,0),m0=days[0].t.slice(0,7),mtd=sm(days.filter(d=>d.t.startsWith(m0))),dom=+days[0].t.slice(8),dim=new Date(+m0.slice(0,4),+m0.slice(5),0).getDate(),pct=Math.min(100,mtd/GOAL*100),pace=mtd/dom*dim;
 $('#gtxt').textContent=`${usd(mtd)} of ${usd(GOAL)}`;$('#gbar').style.width=pct+'%';$('#fillbg').style.setProperty('--fill',pct+'%');
 $('#gsub').textContent=(mtd>=GOAL?'Goal reached! ':`${pct.toFixed(0)}% done. `)+`On pace for ${usd(pace)} this month.`;
 let prev=null,lab='';
 if(period==='M'){const d=new Date(+m0.slice(0,4),+m0.slice(5)-2,1),pm=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');prev=sm(days.filter(x=>x.t.startsWith(pm)&&+x.t.slice(8)<=N));lab='the same days last month'}
 else if(days.length>=2*period){prev=sm(days.slice(period,2*period));lab=period===1?'yesterday':`the previous ${period} days`}
 const cm=$('#cmp');
 if(prev===null||(prev===0&&earn===0)){cm.textContent=''}
 else if(prev===0){cm.className='cmp';cm.textContent=`▲ Up from $0.00 in ${lab}`}
 else{const ch=(earn-prev)/prev*100;cm.className='cmp'+(ch<0?' down':'');cm.textContent=`${ch>=0?'▲':'▼'} ${Math.abs(ch).toFixed(0)}% vs ${lab} (${usd(prev)})`}
 const mon={};days.forEach(d=>{const m=d.t.slice(0,7);mon[m]=(mon[m]||0)+d.earn});
 const [bm,be]=Object.entries(mon).sort((a,b)=>b[1]-a[1])[0],bd=days.reduce((a,d)=>d.earn>a.earn?d:a,days[0]);
 $('#r-month').textContent=be>0?usd(be):'–';$('#r-month2').textContent=be>0?new Date(+bm.slice(0,4),+bm.slice(5)-1,1).toLocaleString('en-US',{month:'long',year:'numeric'})+(bm===m0?', this month':''):'';
 $('#r-day').textContent=bd.earn>0?usd(bd.earn):'–';$('#r-day2').textContent=bd.earn>0?new Date(bd.t+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
 const n=Math.max(N,7),c=days.slice(0,n).reverse(),max=Math.max(...c.map(d=>d.earn),1),w=1000/n;
 $('#svg').innerHTML='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3d3d"/><stop offset="1" stop-color="#8a1218"/></linearGradient></defs>'+
  c.map((d,i)=>{const h=Math.max(d.earn/max*156,d.earn>0?3:1.5);return `<rect x="${i*w+w*.15}" y="${170-h}" width="${w*.7}" height="${h}" fill="url(#g)" opacity="${d.earn>0?1:.3}"><title>${d.t}: ${usd(d.earn)}</title></rect>`}).join('');
 $('#ccap').textContent=period==='M'&&N>=7?'Commission per day, this month':`Commission per day, last ${n} days`;$('#a1').textContent=c[0].t;$('#a2').textContent=c[c.length-1].t;
}
async function load(){
 try{
  const r=await fetch('/api/stats',{headers:{'x-key':store.get('key')||''},cache:'no-store'});
  if(r.status===401){$('#keybox').style.display='flex';$('#app').style.display='none';setStatus('Locked',true);return}
  if(!r.ok){let m='Error '+r.status;try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}
  const j=await r.json();
  days=Object.values(j).map(d=>{const [dd,mm,yy]=d.date.split('.');return{t:`${yy}-${mm}-${dd}`,orders:+d.orders,visits:+d.visits,sales:+d.sum_price_clean,earn:+d.sum_earnings_clean}}).sort((a,b)=>a.t<b.t?1:-1);
  $('#keybox').style.display='none';$('#app').style.display='';render();
  setStatus('Live, updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
 }catch(e){setStatus('Could not load stats: '+e.message,true)}
}
$('#keybox').onsubmit=e=>{e.preventDefault();store.set('key',$('#keyin').value);load()};
load();setInterval(load,30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});

/* grid turns maroon under the cursor */
if(matchMedia('(hover:hover)').matches){
 const root=document.documentElement,cell=16,k=matchMedia('(prefers-reduced-motion:reduce)').matches?1:.16;let raf=0,tx=0,ty=0,cx=0,cy=0,seen=false;
 const follow=()=>{cx+=(tx-cx)*k;cy+=(ty-cy)*k;root.style.setProperty('--mx',cx+'px');root.style.setProperty('--my',cy+'px');raf=(Math.abs(tx-cx)>.5||Math.abs(ty-cy)>.5)?requestAnimationFrame(follow):0};
 addEventListener('pointermove',ev=>{tx=ev.clientX;ty=ev.clientY;if(!seen){seen=true;cx=tx;cy=ty}
  root.style.setProperty('--cx',(Math.floor((tx+1)/cell)*cell-1)+'px');root.style.setProperty('--cy',(Math.floor((ty+1)/cell)*cell-1)+'px');root.style.setProperty('--on',1);if(!raf)raf=requestAnimationFrame(follow)},{passive:true});
 document.addEventListener('mouseleave',()=>root.style.setProperty('--on',0));
}
</script>
</body>
</html>
