<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Ledger</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0703;--gold:#f5c542;--hi:#fff1b8;--lo:#b8860b;--text:#eadcb8;--dim:#9c8a5e;--line:rgba(245,197,66,.22)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(ellipse 80% 55% at 50% -10%,rgba(245,197,66,.22),transparent 70%),radial-gradient(ellipse 60% 40% at 50% 110%,rgba(184,134,11,.18),transparent 70%),var(--ink);color:var(--text);font:400 16px/1.5 Jost,system-ui,sans-serif;padding:max(28px,env(safe-area-inset-top)) 24px 48px}
main{max-width:1000px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font:500 22px Bodoni Moda,Georgia,serif;color:var(--gold);letter-spacing:.02em;text-shadow:0 0 18px rgba(245,197,66,.5)}
#status{font-size:14px;color:var(--dim);display:flex;align-items:center;gap:8px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:pulse 2s infinite}
#dot.err{background:#c0583a;box-shadow:0 0 10px #c0583a;animation:none}
@keyframes pulse{50%{opacity:.35}}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:56px 0 28px}
.tabs button{font:500 16px Jost,sans-serif;color:var(--gold);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 22px;cursor:pointer;transition:.2s}
.tabs button:hover{border-color:var(--gold)}
.tabs button[aria-pressed=true]{color:#1a1204;background:linear-gradient(180deg,var(--hi),var(--gold) 55%,var(--lo));border-color:transparent;box-shadow:0 0 26px rgba(245,197,66,.55)}
button:focus-visible,input:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
.lbl{color:var(--dim);font-size:15px}
#hero{font:700 clamp(64px,15vw,176px)/1.05 Bodoni Moda,Georgia,serif;font-variant-numeric:lining-nums tabular-nums;background:linear-gradient(180deg,var(--hi) 5%,var(--gold) 45%,var(--lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(245,197,66,.5)) drop-shadow(0 0 60px rgba(245,197,66,.25));margin:4px 0 36px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line)}
.stats div{padding:20px 20px 20px 0}
.stats div+div{padding-left:20px;border-left:1px solid var(--line)}
.stats b{display:block;font:500 28px Bodoni Moda,Georgia,serif;color:var(--hi);text-shadow:0 0 14px rgba(245,197,66,.35)}
.chart{margin-top:36px;border-top:1px solid var(--line);padding-top:20px}
svg{width:100%;height:190px;display:block;filter:drop-shadow(0 0 8px rgba(245,197,66,.35))}
.axis{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:8px}
#keybox{display:none;margin-top:48px;gap:10px;flex-wrap:wrap}
#keybox input{flex:1;min-width:200px;background:#120d05;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 14px;font:inherit}
#keybox button{font:500 16px Jost;background:var(--gold);color:#1a1204;border:0;border-radius:10px;padding:11px 22px;cursor:pointer}
@media (prefers-reduced-motion:reduce){#dot{animation:none}}
</style>
</head>
<body>
<main>
<header><h1>Sales Ledger</h1><div id="status"><span id="dot"></span><span id="stxt">Loading…</span></div></header>
<form id="keybox"><input id="keyin" type="password" placeholder="Enter your dashboard key" autocomplete="current-password"><button>Unlock</button></form>
<div id="app">
<nav class="tabs" id="tabs" aria-label="Time period"></nav>
<p class="lbl" id="cap">Earnings</p>
<div id="hero">$0.00</div>
<section class="stats">
<div><span class="lbl">Sales volume</span><b id="s-sales">–</b></div>
<div><span class="lbl">Orders</span><b id="s-orders">–</b></div>
<div><span class="lbl">Visits</span><b id="s-visits">–</b></div>
<div><span class="lbl">Conversion</span><b id="s-conv">–</b></div>
</section>
<section class="chart"><p class="lbl" id="ccap">Earnings per day</p><svg id="svg" viewBox="0 0 1000 190" preserveAspectRatio="none" role="img" aria-label="Earnings per day"></svg><div class="axis"><span id="a1"></span><span id="a2"></span></div></section>
</div>
</main>
<script>
const $=s=>document.querySelector(s),P=[1,7,30,90,365];
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let days=[],period=P.includes(+store.get('period'))?+store.get('period'):7,shown=0,first=true;
const usd=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const setStatus=(t,e)=>{$('#stxt').textContent=t;$('#dot').className=e?'err':''};
$('#tabs').innerHTML=P.map(p=>`<button data-p="${p}" aria-pressed="${p===period}">${p}d</button>`).join('');
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;period=+b.dataset.p;store.set('period',period);document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
function count(to){const from=shown,t0=performance.now(),d=first?1400:700;first=false;
 (function f(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);shown=from+(to-from)*e;$('#hero').textContent=usd(shown);if(k<1)requestAnimationFrame(f);else shown=to})(t0)}
function render(){
 if(!days.length)return;
 const s=days.slice(0,period),sum=k=>s.reduce((a,d)=>a+d[k],0),earn=sum('earn'),orders=sum('orders'),visits=sum('visits');
 $('#cap').textContent=period===1?'Earnings today':`Earnings, last ${period} days`;
 count(earn);
 $('#s-sales').textContent=usd(sum('sales'));$('#s-orders').textContent=orders.toLocaleString('en-US');
 $('#s-visits').textContent=visits.toLocaleString('en-US');$('#s-conv').textContent=visits?(orders/visits*100).toFixed(1)+'%':'–';
 const n=Math.max(period,7),c=days.slice(0,n).reverse(),max=Math.max(...c.map(d=>d.earn),1),w=1000/n;
 $('#svg').innerHTML='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset=".5" stop-color="#f5c542"/><stop offset="1" stop-color="#b8860b"/></linearGradient></defs>'+
  c.map((d,i)=>{const h=Math.max(d.earn/max*176,d.earn>0?3:1.5);return `<rect x="${i*w+w*.15}" y="${190-h}" width="${w*.7}" height="${h}" rx="1.5" fill="url(#g)" opacity="${d.earn>0?1:.3}"><title>${d.t}: ${usd(d.earn)}</title></rect>`}).join('');
 $('#ccap').textContent=`Earnings per day, last ${n} days`;$('#a1').textContent=c[0].t;$('#a2').textContent=c[c.length-1].t;
}
async function load(){
 try{
  const r=await fetch('/api/stats',{headers:{'x-key':store.get('key')||''},cache:'no-store'});
  if(r.status===401){$('#keybox').style.display='flex';$('#app').style.display='none';setStatus('Locked',true);return}
  if(!r.ok)throw new Error(r.status);
  const j=await r.json();
  days=Object.values(j).map(d=>{const [dd,mm,yy]=d.date.split('.');return{t:`${yy}-${mm}-${dd}`,orders:+d.orders,visits:+d.visits,sales:+d.sum_price_clean,earn:+d.sum_earnings_clean}}).sort((a,b)=>a.t<b.t?1:-1);
  $('#keybox').style.display='none';$('#app').style.display='';render();
  setStatus('Live, updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}));
 }catch(e){setStatus('Could not load stats. Retrying…',true)}
}
$('#keybox').onsubmit=e=>{e.preventDefault();store.set('key',$('#keyin').value);load()};
load();setInterval(load,30000);
</script>
</body>
</html>
